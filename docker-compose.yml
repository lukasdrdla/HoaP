services:
  postgres:
    image: postgres:17
    container_name: hoap-postgres
    restart: always
    environment:
      POSTGRES_DB: hoap_db
      POSTGRES_USER: hoap_user
      POSTGRES_PASSWORD: hoap_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: HoaP.Web/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=hoap_db;Username=hoap_user;Password=hoap_pass;
      - ConnectionStrings__MasterConnection=Host=postgres;Port=5432;Database=hoap_db;Username=hoap_user;Password=hoap_pass;

volumes:
  postgres_data:
